name: pet_shop
description: "A new Flutter project."


publish_to: 'none'




environment:
  sdk: '>=3.4.3 <4.0.0'


dependencies:
  flutter:
    sdk: flutter
# ----------- Utility package ---------------- #
  intl: 0.19.0
  logger: ^2.4.0
  url_launcher: ^6.3.0
  flutter_native_splash: ^2.4.1
  carousel_slider: 4.2.1
  smooth_page_indicator: ^1.2.0+3
  cached_network_image: 3.3.1
  lottie: 3.1.2
  connectivity_plus: ^6.0.4
  http: ^1.4.0
  shimmer: 3.0.0
  pinput: ^5.0.1
  shared_preferences: ^2.3.3
  animations: ^2.0.11
  dio: ^5.3.3
  image_picker: ^1.1.2
  mime: ^2.0.0
# --------- icon -------------------#
  iconsax: ^0.0.8
# ---------------- State management ---------- #
  get_storage: ^2.1.1
  get: 4.6.6

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter



  flutter_lints: ^3.0.0




flutter:



  uses-material-design: true

